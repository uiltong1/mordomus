# Mordomus Gateway — headers padrão de proxy (includo por cada location)
proxy_http_version 1.1;
# request-id de volta na resposta, para o cliente correlacionar com o envelope
add_header X-Request-Id $req_id always;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id      $req_id;
# header forjado: o escopo de tenant vem sempre do claim `tid` validado pelo
# TenantScope — descartado aqui para nunca alcançar o backend.
proxy_set_header X-Tenant-ID       "";
proxy_set_header Connection        "";

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

proxy_buffering  on;
proxy_buffers    16 16k;
proxy_buffer_size 32k;
