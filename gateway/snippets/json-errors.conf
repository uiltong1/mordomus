# Mordomus — erros do gateway em JSON (nunca HTML)
error_page 502 503 504 = @json_upstream_error;

location @json_upstream_error {
    default_type application/json;
    add_header X-Request-Id $req_id always;
    return 502 '{"error":{"code":"upstream_unavailable","message":"Serviço indisponível no gateway do Mordomus","request_id":"$req_id"}}';
}
