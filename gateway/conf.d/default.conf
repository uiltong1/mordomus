map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

# Mordomus — gateway fino (ADR-011): proxy de borda único.
# Não autentica, não reemite token, não conhece regra de negócio.
# Responsabilidades: rate limit por IP, X-Request-Id, descarte de header
# forjado, roteamento e /health agregado.
limit_req_zone $binary_remote_addr zone=mordomus_api:10m rate=10r/s;

upstream up_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # JSON no lugar de páginas HTML de erro do nginx
    include /etc/nginx/snippets/json-errors.conf;

    # --- /health agregado (proxya a saúde do monólito) ------------------------
    location = /health {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://up_api/health;
    }

    # --- JWKS local (chaves RS256) -------------------------------------------
    location = /.well-known/jwks.json {
        alias /usr/share/nginx/html/jwks/jwks.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        add_header X-Request-Id $req_id always;
    }

    # --- roteamento: tudo sob /api/v1/ para o monólito ------------------------
    location /api/ {
        limit_req zone=mordomus_api burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://up_api;
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"Rota não encontrada no gateway do Mordomus"}}';
    }
}
