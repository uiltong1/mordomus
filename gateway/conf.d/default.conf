# Mordomus — API Gateway (T1.1: roteamento + request-id + JWKS)
# T1.3 acrescenta: validação de JWT, injeção de X-Tenant-ID e JWT de serviço.

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream up_identity    { server identity:8080;    keepalive 16; }
upstream up_maintenance { server maintenance:8080; keepalive 16; }
upstream up_scheduling  { server scheduling:8080;  keepalive 16; }
upstream up_financial   { server financial:8080;   keepalive 16; }
upstream up_notification{ server notification:8080;keepalive 16; }

server {
    listen 80;
    server_name _;
    server_tokens off;

    # JSON no lugar de páginas HTML de erro do nginx
    include /etc/nginx/snippets/json-errors.conf;

    # --- health do próprio gateway -------------------------------------------
    location = /health {
        default_type application/json;
        add_header X-Request-Id $req_id always;
        return 200 '{"service":"mordomus-gateway","status":"ok"}';
    }

    # --- JWKS local (chaves RS256) -------------------------------------------
    location = /.well-known/jwks.json {
        alias /usr/share/nginx/html/jwks/jwks.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        add_header X-Request-Id $req_id always;
    }

    # --- roteamento por bounded context --------------------------------------
    location /api/v1/identity {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://up_identity;
    }

    location /api/v1/maintenance {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://up_maintenance;
    }

    location /api/v1/scheduling {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://up_scheduling;
    }

    location /api/v1/financial {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://up_financial;
    }

    location /api/v1/notification {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://up_notification;
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"Rota não encontrada no gateway do Mordomus"}}';
    }
}
