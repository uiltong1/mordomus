name: mordomus

# ---------------------------------------------------------------------------
# Mordomus — ambiente unificado
# Monólito modular (api) + gateway fino + postgres (1 database) + redis
# + mailpit + frontend  =  8 containers
# ---------------------------------------------------------------------------

x-laravel-env: &laravel-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: "${APP_KEY:?APP_KEY ausente — rode 'make secrets'}"
  APP_URL: http://localhost:8080
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: mordomus
  DB_USERNAME: "${POSTGRES_USER:?POSTGRES_USER ausente — rode 'make secrets'}"
  DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ausente — rode 'make secrets'}"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # prefixo único e explícito: api/api-worker/api-scheduler compartilham o
  # mesmo Redis, e é o que faz a fila e o lock de `ShouldBeUnique` atravessarem
  # a fronteira entre os processos
  REDIS_PREFIX: mordomus-database-
  CACHE_STORE: redis
  CACHE_PREFIX: mordomus-cache-
  QUEUE_CONNECTION: redis
  # filas nomeadas que o api-worker drena (TECHSPEC §2.1); sem esta lista o
  # worker só consumiria `default` e o motor de agendamento ficaria parado
  QUEUE_WORKER_QUEUES: "default,mordomus:scheduling:occurrences,mordomus:notification:events,mordomus:notification:push,mordomus:notification:emails"
  # janela de materialização do motor, em dias
  SCHEDULING_HORIZON_DAYS: "45"
  SESSION_DRIVER: file
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: no-reply@mordomus.app
  MAIL_FROM_NAME: Mordomus
  HASH_DRIVER: argon2id
  LOG_CHANNEL: json
  APP_TIMEZONE: America/Sao_Paulo
  APP_LOCALE: pt_BR
  JWT_USER_SECRET: "${JWT_USER_SECRET:?JWT_USER_SECRET ausente — rode 'make secrets'}"
  JWT_KID: "${JWT_KID:?JWT_KID ausente — rode 'make secrets'}"
  # entrypoint copia /run/secrets → /run/mordomus com leitura para www-data
  JWT_RSA_PRIVATE_KEY: /run/mordomus/rsa_private.pem
  JWT_RSA_PUBLIC_KEY: /run/mordomus/rsa_public.pem
  # par VAPID do ambiente (ADR-001); o mesmo padrão do par do JWT — a config
  # aceita o caminho do arquivo ou o PEM embutido
  VAPID_PRIVATE_KEY: /run/mordomus/vapid_private.pem
  VAPID_PUBLIC_KEY: /run/mordomus/vapid_public.pem
  TZ: America/Sao_Paulo
  WAIT_FOR_DB: "1"
  AUTO_COMPOSER: "1"
  RUN_ROLE: http

x-app: &app
  networks: [backend]
  restart: unless-stopped
  build:
    context: .
    dockerfile: docker/php/api.Dockerfile
    args: { BASE_IMAGE: mordomus-php:8.3 }
  image: mordomus-api:dev
  environment:
    <<: *laravel-env
    APP_NAME: Mordomus
  volumes:
    - ./api:/var/www/html
    - ./.secrets/rsa_private.pem:/run/secrets/rsa_private.pem:ro
    - ./.secrets/rsa_public.pem:/run/secrets/rsa_public.pem:ro
    - ./.secrets/vapid_private.pem:/run/secrets/vapid_private.pem:ro
    - ./.secrets/vapid_public.pem:/run/secrets/vapid_public.pem:ro
    - ./packages:/var/www/packages
  depends_on:
    postgres: { condition: service_healthy }
    redis:    { condition: service_healthy }

x-app-healthcheck: &app-healthcheck
  test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
  interval: 15s
  timeout: 5s
  retries: 6
  start_period: 90s

services:
  # ------------------------------- data ------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: mordomus
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d mordomus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"   # UI
      - "1025:1025"   # SMTP
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8025/api/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]
    restart: unless-stopped

  # ------------------------------ gateway ----------------------------------
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/conf.d:/etc/nginx/conf.d:ro
      - ./gateway/snippets:/etc/nginx/snippets:ro
      - ./gateway/jwks:/usr/share/nginx/html/jwks:ro
    ports:
      - "8080:80"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [edge, backend]
    restart: unless-stopped

  # ---------------------------- monólito -----------------------------------
  api:
    <<: *app
    healthcheck: *app-healthcheck
    # porta não publicada: o PHP só é alcançável pela rede `backend`,
    # para que nenhum processo PHP seja alcançável de fora — só o gateway
    # expõe porta externa

  api-worker:
    <<: *app
    environment:
      <<: *laravel-env
      APP_NAME: Mordomus Worker
      RUN_ROLE: worker
    # worker não serve HTTP: healthcheck do processo
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

  api-scheduler:
    <<: *app
    environment:
      <<: *laravel-env
      APP_NAME: Mordomus Scheduler
      RUN_ROLE: scheduler
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ------------------------------ frontend ---------------------------------
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      NODE_ENV: development
      VITE_API_BASE: http://localhost:8080
      VITE_VAPID_PUBLIC_KEY: "${VITE_VAPID_PUBLIC_KEY:-}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks: [edge]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:

networks:
  edge:
  backend:
