<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Mordomus — manutenção da casa, agenda da família e contas em um lugar só."
    />
    <script>
      // Aplica o tema antes da primeira pintura. Um script externo não resolve:
      // o Vite não empacota `<script>` sem `type="module"`, e um módulo é adiado
      // — nos dois casos o morador abriria o app vendo o tema errado. A resolução
      // espelha `shared/theme/theme.ts`, e o teste de fiação cobra que continuem
      // iguais: chave, normalização do valor lido e consulta de sistema.
      ;(function () {
        var preference = 'system'
        try {
          preference = window.localStorage.getItem('mordomus.theme') || 'system'
        } catch (error) {
          // sem storage (aba anônima) a preferência do sistema é a resposta
        }
        if (preference !== 'light' && preference !== 'dark') preference = 'system'
        var dark =
          preference === 'dark' ||
          (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Mordomus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
