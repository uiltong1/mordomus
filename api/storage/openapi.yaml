      operationId: 3637fdb9a49f12072bfee71a953e1c4b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - subject_type
                - subject_id
                - title
                - type
              properties:
                subject_type:
                  type: string
                  example: asset
                  enum: [asset, bill]
                subject_id:
                  description: 'Ativo ou conta alvo'
                  type: string
                  maxLength: 26
                title:
                  type: string
                  example: 'Trocar o filtro do ar'
                  maxLength: 160
                description:
                  type: string
                  nullable: true
                  maxLength: 500
                is_active:
                  type: boolean
                  default: true
                type:
                  type: string
                  example: INTERVAL
                  enum: [INTERVAL, CALENDAR_MONTHLY, POST_COMPLETION, ESCALATED]
                interval_value:
                  description: 'Obrigatório em INTERVAL e POST_COMPLETION'
                  type: integer
                  example: 90
                  maximum: 65535
                  minimum: 1
                interval_unit:
                  type: string
                  example: days
                  enum: [days, weeks, months]
                day_of_month:
                  description: 'Obrigatório em CALENDAR_MONTHLY'
                  type: integer
                  maximum: 31
                  minimum: 1
                advance_notice_days:
                  type: integer
                  default: 0
                  maximum: 365
                  minimum: 0
                recalculate_base:
                  description: 'Obrigatório em POST_COMPLETION'
                  type: string
                  enum: [DUE_DATE, COMPLETION]
                custom_offsets:
                  description: 'Obrigatório em ESCALATED; ex.: [-7,-3,0,1]'
                  type: array
                  items: { type: integer }
                preferred_hour:
                  description: 'HH:MM; sem ela vale a da residência'
                  type: string
                  example: '09:00'
              type: object
