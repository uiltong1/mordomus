components:
  schemas:
    Asset:
      description: 'Item do inventário, sempre dentro de um cômodo da residência'
      required:
        - id
        - tenant_id
        - room_id
        - name
        - archived
      properties:
        id:
          type: string
          example: 01J8Z0M9W3K6Q2T4R5Y7B8C9D0
        tenant_id:
          type: string
          example: 01J8Z0M9W3K6Q2T4R5Y7B8C9D1
        room_id:
          type: string
          example: 01J8Z0M9W3K6Q2T4R5Y7B8C9D2
        name:
          type: string
          example: Ar-condicionado
        category:
          type: string
          example: eletro
          nullable: true
        brand:
          type: string
          example: Springer
          nullable: true
        model:
          type: string
          example: X-12000
          nullable: true
        acquired_at:
          type: string
          format: date-time
          example: '2024-01-15T00:00:00-03:00'
          nullable: true
        warranty_until:
          type: string
          format: date-time
          example: '2027-03-15T00:00:00-03:00'
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        archived:
          type: boolean
          example: false
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      type: object
    Error:
      description: 'Envelope de erro da API'
      required:
        - error
      properties:
        error:
          required:
            - code
            - message
            - details
            - request_id
          properties:
            code:
              type: string
              example: validation_failed
            message:
              type: string
              example: 'Dados inválidos.'
            details:
              description: 'Detalhes livres: objeto por campo (validação) ou lista de esperados/recebidos'
              oneOf:
                -
                  type: object
                  example: { email: ['O e-mail já está em uso.'] }
                  additionalProperties: true
                -
                  type: array
                  items: { type: string }
                  example: [01ABC]
            request_id:
              type: string
              example: smoke-0001
              nullable: true
          type: object
      type: object
    Health:
      description: 'Saúde do monólito'
      required:
        - service
        - status
        - checks
        - request_id
        - duration_ms
        - timestamp
      properties:
        service:
          type: string
          example: Mordomus
        status:
          type: string
          example: ok
          enum:
            - ok
            - degraded
        checks:
          properties:
            database:
              properties:
                status:
                  type: string
                  example: up
                  enum: [up, down]
                connection:
                  type: string
                  example: pgsql
              type: object
            cache:
              type: string
              example: redis
            queue:
              type: string
              example: redis
          type: object
        tenant:
          description: 'Residência resolvida pelo backend'
          type: string
          nullable: true
        request_id:
          type: string
          example: smoke-0001
        duration_ms:
          type: number
          format: float
          example: 3.2
        timestamp:
          type: string
          format: date-time
      type: object
    Invitation:
      description: 'Convite emitido para um e-mail'
      required:
        - id
        - email
        - role
        - expires_at
        - accepted_at
      properties:
        id:
          type: string
          example: 01J8Z0M9W3K6Q2T4R5Y7B8C9D0
        email:
          type: string
          format: email
          example: convidada@mordomus.test
        role:
          properties:
            id:
              type: string
            key:
              type: string
              example: member
            name:
              type: string
              example: Morador
          type: object
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
      type: object
    Member:
      description: 'Membro ativo de uma residência'
      required:
        - id
        - user
        - role
        - status
        - capabilities
      properties:
        id:
          type: string
          example: 01J8Z0M9W3K6Q2T4R5Y7B8C9D0
        user:
          $ref: '#/components/schemas/User'
        role:
          required:
            - id
            - key
            - name
          properties:
            id:
              type: string
            key:
              type: string
              example: member
            name:
              type: string
              example: Morador
          type: object
        status:
          type: string
          example: active
        capabilities:
          type: array
          items:
            type: string
          example:
            - bills.pay
      type: object
    PageMeta:
      description: 'Paginação offset'
      required:
        - page
        - per_page
        - total
        - last_page
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 42
        last_page:
          type: integer
          example: 2
      type: object
    Preferences:
      description: 'Preferências da residência'
      required:
        - tenant_id
        - preferred_hour
        - quiet_hours
        - channels
      properties:
        tenant_id:
          type: string
          example: 01J8Z0M9W3K6Q2T4R5Y7B8C9D0
        preferred_hour:
          type: string
          example: '09:00'
        quiet_hours:
          properties:
            start:
              type: string
              example: '22:00'
            end:
              type: string
              example: '07:00'
          type: object
        channels:
          properties:
            email:
              type: boolean
              example: true
            push:
              type: boolean
              example: false
            in_app:
              type: boolean
              example: true
          type: object
      type: object
    Room:
      description: 'Cômodo do imóvel'
      required:
        - id
        - tenant_id
        - name
        - sort_order
        - archived
      properties:
        id:
          type: string
          example: 01J8Z0M9W3K6Q2T4R5Y7B8C9D0
        tenant_id:
          type: string
          example: 01J8Z0M9W3K6Q2T4R5Y7B8C9D1
        name:
          type: string
          example: Sala
        icon:
          type: string
          example: sofa
          nullable: true
        sort_order:
          type: integer
          example: 0
        archived:
          type: boolean
          example: false
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      type: object
    ServiceInfo:
      description: 'Identificação do serviço na raiz do host'
      required:
        - service
        - status
      properties:
        service:
          type: string
          example: Mordomus
        status:
          type: string
          example: ok
          enum:
            - ok
      type: object
    Session:
      description: 'Sessão emitida pelas rotas de autenticação'
      required:
        - token_type
        - access_token
        - expires_in
        - active_tenant
        - refresh_token
        - refresh_expires_in
        - user
        - tenants
      properties:
        token_type:
          type: string
          example: bearer
        access_token:
          description: 'JWT RS256 com as claims sub, tid e tenants'
          type: string
        expires_in:
          type: integer
          example: 3600
        active_tenant:
          type: string
          example: 01J8Z0M9W3K6Q2T4R5Y7B8C9D0
          nullable: true
        refresh_token:
          description: 'Token opaco de uso único'
          type: string
        refresh_expires_in:
          type: integer
          example: 2592000
        user:
          $ref: '#/components/schemas/User'
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantSummary'
      type: object
    Tenant:
      description: 'Residência com as capabilities do membro autenticado'
      required:
        - id
        - name
        - slug
        - timezone
        - preferred_hour
        - archived
        - capabilities
        - created_at
      properties:
        id:
          type: string
          example: 01J8Z0M9W3K6Q2T4R5Y7B8C9D0
        name:
          type: string
          example: 'Casa Principal'
        slug:
          type: string
          example: casa-principal
        timezone:
          type: string
          example: America/Sao_Paulo
        preferred_hour:
          type: string
          example: '09:00'
        archived:
          type: boolean
          example: false
        archived_at:
          type: string
          format: date-time
          nullable: true
        role:
          properties:
            id:
              type: string
            key:
              type: string
              example: owner
            name:
              type: string
              example: Proprietário
          type: object
          nullable: true
        capabilities:
          type: array
          items:
            type: string
          example:
            - tenant.manage
        created_at:
          type: string
          format: date-time
          nullable: true
      type: object
    TenantSummary:
      description: 'Residência resumida, como aparece nas listas de sessão do usuário'
      required:
        - id
        - name
        - slug
        - role
        - role_key
        - capabilities
      properties:
        id:
          type: string
          example: 01J8Z0M9W3K6Q2T4R5Y7B8C9D0
        name:
          type: string
          example: 'Casa Principal'
        slug:
          type: string
          example: casa-principal
        role:
          type: string
          example: Proprietário
        role_key:
          type: string
          example: owner
        capabilities:
          type: array
          items:
            type: string
          example:
            - rooms.manage
      type: object
    TriggerConfig:
      description: 'Regra de recorrência de um alvo (ativo ou conta), com a próxima data já calculada no fuso da residência'
      required:
        - id
        - tenant_id
        - subject_type
        - subject_id
        - title
        - is_active
        - type
        - advance_notice_days
      properties:
        id:
          type: string
          example: 01J8Z0M9W3K6Q2T4R5Y7B8C9D0
        tenant_id:
          type: string
          example: 01J8Z0M9W3K6Q2T4R5Y7B8C9D1
        subject_type:
          description: 'Alvo da regra'
          type: string
          enum:
            - asset
            - bill
        subject_id:
          description: 'Ativo ou conta alvo, conforme subject_type'
          type: string
        title:
          type: string
          example: 'Trocar o filtro do ar'
          maxLength: 160
        description:
          type: string
          nullable: true
          maxLength: 500
        is_active:
          description: 'Regra pausada não gera novas datas'
          type: boolean
          example: true
        type:
          type: string
          enum:
            - INTERVAL
            - CALENDAR_MONTHLY
            - POST_COMPLETION
            - ESCALATED
        interval_value:
          description: 'Obrigatório em INTERVAL e POST_COMPLETION'
          type: integer
          nullable: true
          maximum: 65535
          minimum: 1
        interval_unit:
          type: string
          nullable: true
          enum:
            - days
            - weeks
            - months
        day_of_month:
          description: 'Obrigatório em CALENDAR_MONTHLY; preso ao último dia em meses curtos'
          type: integer
          nullable: true
          maximum: 31
          minimum: 1
        advance_notice_days:
          description: ' antecedência do aviso, em dias'
          type: integer
          maximum: 365
          minimum: 0
        recalculate_base:
          description: 'Obrigatório em POST_COMPLETION'
          type: string
          nullable: true
          enum:
            - DUE_DATE
            - COMPLETION
        custom_offsets:
          description: 'Obrigatório em ESCALATED; negativo avisa antes, positivo atrasado'
          type: array
          items:
            type: integer
          nullable: true
        preferred_hour:
          description: 'HH:MM; sem ela vale a da residência'
          type: string
          example: '09:00'
          nullable: true
        last_base_date:
          description: 'Âncora do ciclo corrente'
          type: string
          format: date
          nullable: true
        next_due_at:
          type: string
          format: date-time
          example: '2026-11-24T12:00:00Z'
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      type: object
    User:
      description: 'Perfil do usuário autenticado'
      required:
        - id
        - name
        - email
        - locale
      properties:
        id:
          type: string
          example: 01J8Z0M9W3K6Q2T4R5Y7B8C9D0
        name:
          type: string
          example: 'Ana Souza'
        email:
          type: string
          format: email
          example: ana@mordomus.test
        locale:
          type: string
          example: pt_BR
      type: object
  securitySchemes:
    jwtBearerAuth:
      type: http
      description: 'Access token devolvido por `/identity/auth/login` e demais rotas de sessão.'
      bearerFormat: JWT
      scheme: bearer
tags:
  -
    name: system
    description: 'Saúde do serviço, raiz do host e documentação'
  -
    name: identity
    description: 'Autenticação, residências, convites e membros'
  -
    name: maintenance
    description: 'Cômodos e inventário do imóvel'
  -
    name: scheduling
    description: scheduling
