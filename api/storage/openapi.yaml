                title:
                  type: string
                  example: 'Trocar o filtro do ar'
                  maxLength: 160
                description:
                  type: string
                  nullable: true
                  maxLength: 500
                is_active:
                  type: boolean
                  default: true
                type:
                  type: string
                  example: INTERVAL
                  enum: [INTERVAL, CALENDAR_MONTHLY, POST_COMPLETION, ESCALATED]
                interval_value:
                  type: integer
                  maximum: 65535
                  minimum: 1
                interval_unit:
                  type: string
                  enum: [days, weeks, months]
                day_of_month:
                  type: integer
                  maximum: 31
                  minimum: 1
                advance_notice_days:
                  type: integer
                  default: 0
                  maximum: 365
                  minimum: 0
                recalculate_base:
                  type: string
                  enum: [DUE_DATE, COMPLETION]
