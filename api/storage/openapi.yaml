openapi: 3.0.0
info:
  title: 'Mordomus API'
  description: 'API do Mordomus — gestão doméstica. Todo o conteúdo vive sob `/api/v1`.'
  version: 1.0.0
servers:
  -
    url: /
    description: 'Origem do gateway (nginx) que faz proxy para o monólito'
paths:
  /health:
    get:
      tags:
        - system
      summary: 'Saúde do serviço (raiz do host)'
      operationId: webHealth
      responses:
        '200':
          description: 'Serviço saudável'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: 'Banco de dados indisponível'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/health:
    get:
      tags:
        - system
      summary: 'Saúde do serviço (prefixo da API)'
      operationId: apiHealth
      responses:
        '200':
          description: 'Serviço saudável'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          description: 'Rate limit do gateway'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'Banco de dados indisponível'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/identity/health:
    get:
      tags:
        - system
      summary: 'Saúde do serviço (módulo Identity)'
      operationId: identityHealth
      responses:
        '200':
          description: 'Serviço saudável'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          description: 'Rate limit do gateway'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'Banco de dados indisponível'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/openapi.yaml:
    get:
      tags:
        - system
      summary: 'Especificação OpenAPI 3.0 em YAML'
      operationId: openApiSpec
      responses:
        '200':
          description: 'Documento OpenAPI'
          content:
            application/yaml: {  }
        '404':
          description: 'Artefato ainda não gerado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit do gateway'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Erro interno'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/docs:
    get:
      tags:
        - system
      summary: 'Interface de leitura da documentação (Swagger UI)'
      operationId: openApiDocs
      responses:
        '200':
          description: 'Página HTML com a especificação carregada'
        '429':
          description: 'Rate limit do gateway'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Erro interno'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /:
    get:
      tags:
        - system
      summary: 'Identificação do serviço na raiz do host'
      operationId: rootInfo
      responses:
        '200':
          description: 'Serviço no ar'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfo'
  /api/v1/identity/auth/register:
    post:
      tags:
        - identity
      summary: 'Registra usuário e cria a primeira residência'
      operationId: 892e60affda0029dce9505a62f675825
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - name
                - email
                - password
                - password_confirmation
              properties:
                name:
                  type: string
                  example: 'Ana Souza'
                  maxLength: 120
                email:
                  type: string
                  format: email
                  example: ana@mordomus.test
                  maxLength: 255
                password:
                  type: string
                  format: password
                  example: senha-forte-123
                  maxLength: 72
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
                  example: senha-forte-123
                home_name:
                  type: string
                  example: 'Casa Principal'
                  maxLength: 120
                timezone:
                  type: string
                  example: America/Sao_Paulo
                  maxLength: 64
              type: object
      responses:
        '201':
          description: 'Usuário e residência criados'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '422':
          description: 'Dados inválidos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit do gateway ou do endpoint'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Erro interno'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/identity/auth/login:
    post:
      tags:
        - identity
      summary: 'Autentica e emite access + refresh token'
      operationId: a5a37b9f77eae7982366b127128f457b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: ana@mordomus.test
                password:
                  type: string
                  format: password
                  example: senha-forte-123
                tenant_id:
                  description: 'Residência desejada; sem ela usa a mais antiga ativa'
                  type: string
              type: object
      responses:
        '200':
          description: 'Sessão emitida'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: 'E-mail ou senha inválidos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Sem membership na residência informada'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Dados inválidos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit do gateway ou do endpoint'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Erro interno'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/identity/auth/refresh:
    post:
      tags:
        - identity
      summary: 'Rotaciona o refresh token e emite nova sessão'
      operationId: 80dfb18bf790cc5d5412e3f5a537b02f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  maxLength: 128
                  minLength: 32
              type: object
      responses:
        '200':
          description: 'Sessão renovada; o refresh enviado deixa de valer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: 'Refresh token inválido, expirado ou reutilizado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Dados inválidos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit do gateway ou do endpoint'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Erro interno'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/identity/auth/logout:
    post:
      tags:
        - identity
      summary: 'Revoga o refresh token enviado'
      operationId: 8d9fbd03dc413ee9ec8e6f9a5ac0b9d3
      requestBody:
        content:
          application/json:
            schema:
              properties:
                refresh_token:
                  type: string
                  maxLength: 128
                  minLength: 32
              type: object
      responses:
        '200':
          description: 'Refresh token revogado (idempotente)'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: ok }
                type: object
        '401':
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Dados inválidos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit do gateway'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Erro interno'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          jwtBearerAuth: []
  /api/v1/identity/auth/switch-tenant:
    post:
      tags:
        - identity
      summary: 'Emite sessão com outra residência ativa'
      operationId: 627fff22515825ba684c25ada32a657f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - tenant_id
              properties:
                tenant_id:
                  type: string
                  example: 01J8Z0M9W3K6Q2T4R5Y7B8C9D0
              type: object
      responses:
        '200':
          description: 'Novo access token com o claim tid atualizado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Sem membership na residência informada'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Dados inválidos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit do gateway'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Erro interno'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          jwtBearerAuth: []
  '/api/v1/identity/tenants/{tenant}/invitations':
    post:
      tags:
        - identity
      summary: 'Convida uma pessoa por e-mail'
      operationId: ca4201fe3bc6fb08251377e73566c845
      parameters:
        -
          parameter: tenant
          name: store
          in: path
          description: 'Id ULID da residência'
          required: true
          schema:
            type: string
            maxLength: 26
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: convidada@mordomus.test
                role_id:
                  description: 'Papel concedido; sem ele o padrão é morador'
                  type: string
              type: object
      responses:
        '201':
          description: 'Convite criado; um convite pendente anterior do mesmo e-mail é substituído'
          content:
            application/json:
              schema:
                properties:
                  data: { $ref: '#/components/schemas/Invitation' }
                  token: { description: 'Token opaco entregue na resposta enquanto não há envio por e-mail', type: string }
                  accept_path: { type: string, example: '/invitations/{token}/accept' }
                type: object
        '401':
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Residência diferente da ativa ou capability members.manage ausente'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Residência não encontrada'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Dados inválidos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit do gateway'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Erro interno'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          jwtBearerAuth: []
  '/api/v1/identity/invitations/{token}/accept':
    post:
      tags:
        - identity
      summary: 'Aceita o convite e entra na residência'
      operationId: 5f245cb409ebb3eb6e2881662db00c35
      parameters:
        -
          parameter: token
          name: accept
          in: path
          description: 'Token opaco recebido no convite'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Membership criado e sessão apontando para a residência'
          content:
            application/json:
              schema:
                properties:
                  token_type: { type: string, example: bearer }
                  access_token: { type: string }
                  expires_in: { type: integer, example: 3600 }
                  active_tenant: { type: string, nullable: true }
                  refresh_token: { type: string }
                  tenant: { properties: { id: { type: string }, name: { type: string }, slug: { type: string }, role: { type: string, example: member } }, type: object }
                  user: { required: [id, name, email], properties: { id: { type: string }, name: { type: string }, email: { type: string, format: email } }, type: object }
                  tenants: { type: array, items: { $ref: '#/components/schemas/TenantSummary' } }
                type: object
        '401':
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Convite pertence a outro e-mail'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Convite não encontrado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Convite já aceito'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: 'Convite expirado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Dados inválidos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit do gateway'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Erro interno'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          jwtBearerAuth: []
  /api/v1/identity/me:
    get:
      tags:
        - identity
      summary: 'Perfil, residências e capabilities efetivas do token'
      operationId: 4a1eb58373f42429daaf89a8aa373de8
      responses:
        '200':
          description: 'Perfil do usuário autenticado'
          content:
            application/json:
              schema:
                properties:
                  data: { required: [user, active_tenant, tenants, capabilities], properties: { user: { $ref: '#/components/schemas/User' }, active_tenant: { type: string, nullable: true }, tenants: { type: array, items: { $ref: '#/components/schemas/TenantSummary' } }, capabilities: { type: array, items: { type: string } } }, type: object }
                type: object
        '401':
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Sem residência ativa no token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit do gateway'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Erro interno'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          jwtBearerAuth: []
  '/api/v1/identity/tenants/{tenant}/members':
    get:
      tags:
        - identity
      summary: 'Lista os membros ativos da residência'
      operationId: dd673b7d87c69f13444599cabd02fb96
      parameters:
        -
          parameter: tenant
          name: index
          in: path
          description: 'Id ULID da residência'
          required: true
          schema:
            type: string
            maxLength: 26
      responses:
        '200':
          description: 'Membros com capabilities efetivas'
          content:
            application/json:
              schema:
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Member' } }
                type: object
        '401':
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Residência diferente da ativa no token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Residência não encontrada'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit do gateway'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Erro interno'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          jwtBearerAuth: []
  '/api/v1/identity/tenants/{tenant}/members/{membership}':
    patch:
      tags:
        - identity
      summary: 'Troca o papel de um membro'
      operationId: 9d67b02cee4e4b615a0606e074428504
      parameters:
        -
          parameter: tenant
          name: update
          in: path
          description: 'Id ULID da residência'
          required: true
          schema:
            type: string
            maxLength: 26
        -
          parameter: membership
          name: update
          in: path
          description: 'Id ULID do membership'
          required: true
          schema:
            type: string
            maxLength: 26
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - role_id
              properties:
                role_id:
                  type: string
                  example: 01J8Z0M9W3K6Q2T4R5Y7B8C9D3
              type: object
      responses:
        '200':
          description: 'Membro atualizado'
          content:
            application/json:
              schema:
                properties:
                  data: { $ref: '#/components/schemas/Member' }
                type: object
        '401':
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Residência diferente da ativa ou capability members.manage ausente'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Membro ou residência não encontrados'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Dados inválidos ou tentativa de alterar a própria role'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit do gateway'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Erro interno'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          jwtBearerAuth: []
  '/api/v1/identity/tenants/{tenant}/members/{membership}/grants':
    put:
      tags:
        - identity
      summary: 'Concede ou remove pontualmente uma capability do membro'
      operationId: 8ba3c240ff668d8c22b5d0e53c0bdf49
      parameters:
        -
          parameter: tenant
          name: updateGrants
          in: path
          description: 'Id ULID da residência'
          required: true
          schema:
            type: string
            maxLength: 26
        -
          parameter: membership
          name: updateGrants
          in: path
          description: 'Id ULID do membership'
          required: true
          schema:
            type: string
            maxLength: 26
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - capability
                - granted
              properties:
                capability:
                  type: string
                  example: rules.edit
                  maxLength: 64
                granted:
                  type: boolean
                  example: true
              type: object
      responses:
        '200':
          description: 'Grant aplicado; capabilities recalculadas'
          content:
            application/json:
              schema:
                properties:
                  data: { $ref: '#/components/schemas/Member' }
                type: object
        '401':
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Residência diferente da ativa ou capability members.manage ausente'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Membro ou residência não encontrados'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Dados inválidos ou tentativa de alterar os próprios grants'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit do gateway'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Erro interno'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          jwtBearerAuth: []
  /api/v1/identity/tenants:
    get:
      tags:
        - identity
      summary: 'Lista as residências do usuário autenticado'
      operationId: e93d3d754cd4332d8f3e0f68891703e0
      parameters:
        -
          parameter: page
          name: index
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        -
          parameter: per_page
          name: index
          in: query
          schema:
            type: integer
            default: 25
            maximum: 100
            minimum: 1
      responses:
        '200':
          description: 'Residências paginadas'
          content:
            application/json:
              schema:
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Tenant' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
                type: object
        '401':
          description: 'Token ausente ou inválido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Sem residência ativa no token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit do gateway'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'Erro interno'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        -
          jwtBearerAuth: []
    post:
      tags:
        - identity
      summary: 'Cria residência e devolve sessão já apontando para ela'
      operationId: fcfffa2533435a4d2b9955358a4cc096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - name
              properties:
                name:
                  type: string
                  example: 'Casa Segunda'
                  maxLength: 120
